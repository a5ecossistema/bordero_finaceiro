server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # a biblioteca de gráficos tem versão fixa: pode cachear à vontade
    location = /chart.umd.min.js {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # o painel é um arquivo só: nunca cachear, senão o deploy novo
    # não aparece pra quem já abriu o painel antes
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
